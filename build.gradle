plugins {
    id 'com.gtnewhorizons.gtnhconvention'
}

version = providers.gradleProperty('modVersion').get()
group = providers.gradleProperty('modGroup').get()

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

def productionDevMods = fileTree('devmods') { include '*.jar' }
def mcpDevMods = fileTree('devmods/deobf') { include '*.jar' }
def remappedDevModsDir = layout.buildDirectory.dir('devmods/remapped')

configurations.create('remappedDevMods') {
    canBeConsumed = false
    canBeResolved = true
    visible = false
}

dependencies {
    // RFG remaps ordinary production (SRG-named) mods into this MCP workspace.
    // Keep explicitly supplied development jars out of that transform.
    remappedDevMods(rfg.deobf(productionDevMods))
    devOnlyNonPublishable(fileTree(remappedDevModsDir) { include '*.jar' })
    devOnlyNonPublishable(mcpDevMods)
    devOnlyNonPublishable("com.github.GTNewHorizons:CodeChickenCore:1.4.16:dev")
    devOnlyNonPublishable("com.github.GTNewHorizons:NotEnoughItems:2.8.114-GTNH:dev")
}

tasks.register('prepareDevMods') {
    group = 'forgegradle'
    description = 'Resolves and remaps the external development mods used by runClient.'
    inputs.files(productionDevMods, mcpDevMods)
    outputs.dir(remappedDevModsDir)

    doLast {
        try {
            def destination = remappedDevModsDir.get().asFile
            delete(destination)
            copy {
                from(configurations.remappedDevMods)
                into(destination)
            }
        } catch (Exception failure) {
            def configuredNames = (productionDevMods.files + mcpDevMods.files)*.name.sort()
            def detail = configuredNames.empty ? 'the development-mod configuration' : configuredNames.join(', ')
            throw new GradleException(
                "Could not prepare development mod(s): ${detail}. " +
                    'Production jars belong in devmods; MCP development jars belong in devmods/deobf.',
                failure)
        }
    }
}

configurations.devOnlyNonPublishable {
    exclude group: 'codechicken', module: 'CodeChickenCore'
    exclude group: 'codechicken', module: 'NotEnoughItems'
}

def prepareDevModsTask = tasks.named('prepareDevMods')

tasks.named('compileJava') {
    dependsOn(prepareDevModsTask)
}

tasks.named('runClient') {
    dependsOn(prepareDevModsTask)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources') {
    inputs.property 'version', project.version
    inputs.property 'mcversion', providers.gradleProperty('minecraftVersion')
    filesMatching('mcmod.info') {
        expand(version: project.version, mcversion: providers.gradleProperty('minecraftVersion').get())
    }
}
